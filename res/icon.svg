<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="TerraProof Day-Night Clock &amp; Orbiting Globe Icon">
  <defs>
    <clipPath id="tp-core-clip">
      <rect x="26" y="26" width="148" height="148" rx="34" />
    </clipPath>
    <linearGradient id="tp-sky-day" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="55%" stop-color="#FEF9C3" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <linearGradient id="tp-sky-night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040D1A" />
      <stop offset="58%" stop-color="#0B2239" />
      <stop offset="100%" stop-color="#0F2E22" />
    </linearGradient>
    <linearGradient id="tp-canopy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="tp-subsoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A16207" />
      <stop offset="100%" stop-color="#5C3A16" />
    </linearGradient>
  </defs>
  <style>
    @keyframes tpOrbitSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes tpDayNightClock {
      0%, 40% { transform: rotate(0deg); }
      50%, 90% { transform: rotate(180deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes tpNightSkyFade {
      0%, 40% { opacity: 0; }
      50%, 90% { opacity: 1; }
      100% { opacity: 0; }
    }
    .orbit { transform-origin: 100px 100px; animation: tpOrbitSpin 9s linear infinite; }
    .wheel { transform-origin: 100px 106px; animation: tpDayNightClock 12s cubic-bezier(0.34, 1.35, 0.64, 1) infinite; }
    .night-sky { animation: tpNightSkyFade 12s ease infinite; }
  </style>
  <circle cx="100" cy="100" r="91" fill="none" stroke="#16A34A" stroke-width="2" stroke-dasharray="6 7" opacity="0.55" />
  <g clip-path="url(#tp-core-clip)">
    <rect x="26" y="26" width="148" height="90" fill="url(#tp-sky-day)" />
    <rect class="night-sky" x="26" y="26" width="148" height="90" fill="url(#tp-sky-night)" />
    <g stroke="#94A3B8" stroke-width="1.4" opacity="0.45">
      <line x1="100" y1="31" x2="100" y2="35" />
      <line x1="48" y1="54" x2="52" y2="57" />
      <line x1="152" y1="54" x2="148" y2="57" />
    </g>
    <g class="wheel">
      <g>
        <circle cx="100" cy="54" r="22" fill="#FDE047" opacity="0.28" />
        <circle cx="100" cy="54" r="14" fill="#FACC15" />
        <g stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round">
          <line x1="100" y1="33" x2="100" y2="36" />
          <line x1="100" y1="72" x2="100" y2="75" />
          <line x1="79" y1="54" x2="82" y2="54" />
          <line x1="118" y1="54" x2="121" y2="54" />
        </g>
      </g>
      <g transform="translate(100, 158) rotate(180)">
        <circle cx="0" cy="0" r="20" fill="#38BDF8" opacity="0.18" />
        <path d="M4 -12 A13 13 0 1 0 14 7 A10.5 10.5 0 1 1 4 -12 Z" fill="#FEF08A" />
        <circle cx="-26" cy="-6" r="2" fill="#E0F2FE" />
        <circle cx="24" cy="-10" r="2.2" fill="#FDE047" />
      </g>
    </g>
    <path d="M22 104 Q66 86 108 103 T178 96 L178 144 L22 144 Z" fill="url(#tp-canopy)" />
    <path d="M22 126 Q76 113 118 128 T178 120 L178 178 L22 178 Z" fill="url(#tp-subsoil)" />
    <path d="M100 132 V86" stroke="#14532D" stroke-width="6" stroke-linecap="round" />
    <path d="M100 100 C80 96 72 80 84 68 C96 68 102 82 100 100 Z" fill="#16A34A" />
    <path d="M100 94 C120 90 128 74 116 62 C104 62 98 76 100 94 Z" fill="#4ADE80" />
  </g>
  <rect x="26" y="26" width="148" height="148" rx="34" fill="none" stroke="#14532D" stroke-width="4" />
  <g class="orbit">
    <g transform="translate(100, 9)">
      <circle r="13" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="2.5" />
      <path d="M-7 -4 Q-2 -9 4 -5 Q9 -1 5 6 Q-1 9 -6 4 Z" fill="#22C55E" />
      <ellipse cx="0" cy="0" rx="13" ry="5" fill="none" stroke="#E0F2FE" stroke-width="1.1" opacity="0.85" />
    </g>
  </g>
</svg>
