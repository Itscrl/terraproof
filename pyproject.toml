[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terraproof"
version = "0.1.0"
description = "Auditable rice planting calendars and historical climate replay"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "scikit-learn>=1.6,<2",
    "pandas>=2.2,<4",
    "joblib>=1.4,<2",
    "h5py>=3.12,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
terraproof = "terraproof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/terraproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
