name: Verify TerraProof
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-mvp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.2'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check src tests frontend/api frontend/scripts/check-api-runtime.py
      - run: uv run ruff format --check src tests frontend/api frontend/scripts/check-api-runtime.py
      - run: uv run pytest -q
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # Ubuntu's Expat can require a newer glibc than the Vercel/Lambda runtime.
      # Package a library from the target OS for the cross-runtime smoke check.
      - name: Stage Amazon Linux Expat
        run: |
          mkdir -p .cache/native
          docker run --rm --platform linux/amd64 --entrypoint /bin/sh \
            -v "$GITHUB_WORKSPACE/.cache/native:/native" \
            public.ecr.aws/amazonlinux/amazonlinux:2023 -ec '
              dnf install -y expat
              cp -L /usr/lib64/libexpat.so.1 /native/libexpat.so.1
            '
      - run: pnpm build
        working-directory: frontend
        env:
          TERRAPROOF_EXPAT_LIBRARY: ${{ github.workspace }}/.cache/native/libexpat.so.1
      - name: Verify minimal serverless Python runtime
        run: |
          docker run --rm --platform linux/amd64 --entrypoint /bin/sh \
            -v "$GITHUB_WORKSPACE/frontend:/var/task:ro" -w /var/task \
            public.ecr.aws/lambda/python:3.12 -ec '
              python -m pip install --no-cache-dir --target /tmp/terraproof-vendor -r requirements.txt
              PYTHONPATH=/tmp/terraproof-vendor python scripts/check-api-runtime.py
            '
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: frontend/test-results
